# StayWatch settings. Environment variables named STAYWATCH_<SECTION>_<KEY> override these.

[paths]
inbox = "inbox"
generator_log = "generator_log.csv"
processed = "processed"
quarantine = "quarantine"
sqlite = "data/analytics.sqlite"
tinydb = "data/raw.json"

[generator]
interval_seconds = 60      # one import per minute
demo_minutes = 30          # default run length when --minutes is not given
records_min = 5
records_max = 10
anomaly_rate = 0.10        # about one import in ten is a seeded spike or drop
resend_rate = 0.05         # chance of also writing a renamed copy of an earlier file
duplicate_row_rate = 0.20  # chance an import repeats one of its own rows
injection_rate = 0.03      # chance a record's guest message tries to give instructions

[agent]
scan_seconds = 15          # how often the loop checks inbox/
min_file_age_seconds = 2   # skip files younger than this (may still be being written)
sql_log_max_text = 80      # long text values are shortened in sql_log

[prompts]
extract = "extract_v3"           # each change is a new file; re-score the gold set after
explain = "explain_v1"
classify = "classify_claude_v1"   # v2 scored 88.6% but regressed on standard messages; see CLAUDE.md

[models]
kill_switch = false        # true = no model calls at all; rules clean everything
jev_enabled = false        # turned off until the Jev key is accepted (HTTP 401 on 2026-10-13)
jev_model = "typesafe-ai/jev"
jev_url = "https://www.jevai.org/api/v1/decisions"
extractor = "claude-haiku-5-5"     # read model names from config: they change
escalation = "claude-sonnet-5-5"
review_confidence = 0.6    # category confidence below this goes to the review queue
extract_max_tokens = 2048
classify_max_tokens = 1024
explain_max_tokens = 1024

[models.effort]
"claude-haiku-5-5" = "low"
"claude-sonnet-5-5" = "low"

[models.fallbacks]
"claude-sonnet-5-5" = true   # server-side refusal fallback ("default" routing)

# USD per million tokens, for estimated_cost_usd in model_usage_log
[models.prices."claude-haiku-5-5"]
input = 0.10
output = 0.50
[models.prices."claude-sonnet-5-5"]
input = 2.00
output = 10.00
[models.prices."claude-haiku-4-5"]
input = 1.00
output = 5.00

[decide]
rule = "anomaly"         # z-score of bookings per import
z_threshold = 3.0
history_imports = 60     # baseline = last N published or released imports

[budget]
max_tokens_per_run = 60000     # per import file
max_tokens_per_day = 600000    # across all imports in a UTC day
